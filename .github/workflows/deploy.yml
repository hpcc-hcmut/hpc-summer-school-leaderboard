name: HPCC Leaderboard CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Build and Push Backend
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}/backend
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker build -t $IMAGE_ID:latest ./backend
          docker push $IMAGE_ID:latest

      - name: Build and Push Frontend
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}/frontend
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker build -t $IMAGE_ID:latest ./frontend
          docker push $IMAGE_ID:latest

  version-bump:
    name: Bump Version and Notify
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Get current version
        id: current_version
        run: |
          cd frontend
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Bump minor version
        id: bump_version
        run: |
          cd frontend
          pnpm version minor --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Previous version: ${{ steps.current_version.outputs.version }}"
          echo "New version: $NEW_VERSION"

      - name: Commit version bump
        run: |
          git add frontend/package.json
          git commit -m "chore: bump version to ${{ steps.bump_version.outputs.new_version }} [skip ci]"
          git push

      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            *HPCC Leaderboard Deployed Successfully!*

            *Version:* ${{ steps.bump_version.outputs.new_version }}
            *Previous:* ${{ steps.current_version.outputs.version }}
            *Branch:* ${{ github.ref }}
            *Status:* Deployed and running

            *Docker Images:* 
            - ghcr.io/${{ github.repository }}/backend:latest
            - ghcr.io/${{ github.repository }}/frontend:latest

            *Deployed at:* ${{ github.event.head_commit.timestamp }}

  deploy:
    name: Deploy Container
    runs-on: [self-hosted, linux, x64, gitc]
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Pull latest Docker images
        run: |
          IMAGE_REPO=$(echo ghcr.io/${{ github.repository }} | tr '[A-Z]' '[a-z]')
          docker pull $IMAGE_REPO/backend:latest
          docker pull $IMAGE_REPO/frontend:latest

      - name: Create .env file
        run: |
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
          echo "ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}" >> .env

      - name: Deploy with Docker Compose
        run: |
          docker compose -f docker-compose.production.yml down --remove-orphans
          docker compose -f docker-compose.production.yml up -d --remove-orphans --force-recreate
